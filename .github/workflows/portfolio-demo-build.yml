name: Portfolio demo build

on:
  push:
    branches: [portfolio-demo-20261112]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build offline demo
        env:
          VITE_DEMO_MODE: 'true'
        run: npm run build:demo
